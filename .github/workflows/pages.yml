name: Deploy Nomadic Method web

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/pages.yml"
      - "web/**"
      - "NomadicMethod/Assets/exercises.json"
      - "NomadicMethod/Assets/reaction_drills.json"
      - "NomadicMethod/Assets/fitness_ratings.json"
      - "NomadicMethod/FitnessProfileView.cs"
      - "NomadicMethod/Assets/reaction_videos/**"
      - "NomadicMethod/Assets/reaction_previews/**"
      - "NomadicMethod/ReactionDrillView.cs"
      - "tools/generate-reaction-drill-media.mjs"
      - "tools/CatalogReviewEvidence.ps1"
      - "tools/Test-CatalogReviewEvidence.ps1"
      - "tools/Test-PreciseSkillAdmissions.ps1"
      - "docs/catalog-audit/precise-admissions-2026-10-23.json"
      - "docs/catalog-audit/precise-skill-review-2026-10-23.json"
      - "docs/catalog-audit/zopd-admissions-2026-10-24.json"
      - "docs/catalog-audit/zopd-skill-review-2026-10-24.json"
      - "docs/catalog-audit/ability-admissions-2026-10-23.json"
      - "docs/catalog-audit/ability-skill-review-2026-10-23.json"
      - "docs/catalog-audit/lower-leg-review-2026-10-26.json"
      - "NomadicMethod/Assets/exercise_videos/**"
      - "NomadicMethod/Assets/exercise_direction_videos/**"
      - "NomadicMethod/Assets/exercise_hold_frames/**"
      - "NomadicMethod/Resources/raw/**"
      - "NomadicMethod/NomadicMethod.csproj"
      - "NomadicMethod/MainActivity*.cs"
      - "NomadicMethod/ExerciseVideoView.cs"
      - "NomadicMethod/RecoveryPrivacyActivity.cs"
      - "NomadicMethod/AndroidManifest.xml"
      - "NomadicMethod/Data/**"
      - "NomadicMethod/Models/**"
      - "NomadicMethod/Services/**"
      - "NomadicMethod/Resources/color/**"
      - "NomadicMethod/Resources/drawable/**"
      - "NomadicMethod/Resources/drawable-xxhdpi/**"
      - "NomadicMethod/Resources/layout/**"
      - "NomadicMethod/Resources/values/**"
      - "docs/catalog-audit/modifier_coverage_deficits_2026-08-29.json"
      - "docs/catalog-audit/modifier_coverage_deficits_current.json"
      - "docs/catalog-audit/migration-2026-09-05.json"
      - "docs/catalog-audit/training-claim-corrections-2026-09-05.json"
      - "tools/nomadic_method_appicon.svg"
      - "tools/ExerciseMirrorRelationships.psd1"
      - "tools/Test-ExerciseMirrorRelationshipAudit.ps1"
      - "tools/ExerciseSessionMovements.psd1"
      - "tools/Test-ExerciseSessionMovementAudit.ps1"
      - "tools/CanonicalMuscleGroups.psd1"
      - "tools/ExerciseSecondaryTrainingClaims.psd1"
      - "tools/Test-ExerciseSecondaryTrainingClaimAudit.ps1"
      - "tools/RealExerciseCatalog.psd1"
      - "tools/AdditionalExerciseCatalog.psd1"
      - "tools/ExerciseCatalogDefinitions.ps1"
      - "tools/Test-ExerciseCatalogDefinitions.ps1"
      - "tools/ExerciseLocomotionSpaces.ps1"
      - "tools/ExerciseLocomotionSpaces.psd1"
      - "tools/Test-ExerciseLocomotionAudit.ps1"
      - "tools/ExerciseFloorContacts.ps1"
      - "tools/ExerciseFloorContacts.psd1"
      - "tools/ExerciseElevationRequirements.psd1"
      - "tools/ExerciseElevationRequirements.ps1"
      - "tools/Test-ExerciseElevationRequirementAudit.ps1"
      - "tools/Test-ExerciseFloorContactAudit.ps1"
      - "tools/ExerciseHardFloorCompatibility.psd1"
      - "tools/Test-ExerciseHardFloorCompatibilityAudit.ps1"
      - "tools/ExerciseExecutionCorrections.psd1"
      - "tools/ExerciseDirectionMediaTransforms.psd1"
      - "tools/Generate-ExerciseCatalog.ps1"
      - "tools/Test-ExerciseExecutionProtocols.ps1"
      - "tools/Test-ExerciseSideSequenceOverrides.ps1"
      - "tools/generate-exercise-fitness-ceiling-scores.mjs"
      - "tools/ExerciseFitnessCeilingScores.json"
      - "tools/ExerciseFitnessCeilingCoveragePolicy.json"
      - "tools/ExerciseReactionCues.json"
      - "docs/ACSM_FITNESS_CEILING_SCORING.md"
      - "docs/catalog-audit/acsm-fitness-ceiling-scores.csv"
      - "docs/catalog-audit/acsm-fitness-ceiling-coverage.json"
      - "docs/catalog-audit/acsm-fitness-ceiling-gaps.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out runtime files
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /web/**
            /NomadicMethod/Assets/exercises.json
            /NomadicMethod/Assets/reaction_drills.json
            /NomadicMethod/Assets/fitness_ratings.json
            /NomadicMethod/FitnessProfileView.cs
            /NomadicMethod/Assets/reaction_videos/**
            /NomadicMethod/Assets/reaction_previews/**
            /NomadicMethod/ReactionDrillView.cs
            /tools/generate-reaction-drill-media.mjs
            /tools/CatalogReviewEvidence.ps1
            /tools/Test-CatalogReviewEvidence.ps1
            /tools/Test-PreciseSkillAdmissions.ps1
            /docs/catalog-audit/precise-admissions-2026-10-23.json
            /docs/catalog-audit/precise-skill-review-2026-10-23.json
            /docs/catalog-audit/zopd-admissions-2026-10-24.json
            /docs/catalog-audit/zopd-skill-review-2026-10-24.json
            /docs/catalog-audit/ability-admissions-2026-10-23.json
            /docs/catalog-audit/ability-skill-review-2026-10-23.json
            /docs/catalog-audit/lower-leg-review-2026-10-26.json
            /NomadicMethod/Assets/exercise_videos/**
            /NomadicMethod/Assets/exercise_direction_videos/**
            /NomadicMethod/Assets/exercise_hold_frames/**
            /NomadicMethod/Resources/raw/**
            /NomadicMethod.Tests/CatalogInvariantTests.cs
            /NomadicMethod/NomadicMethod.csproj
            /NomadicMethod/MainActivity*.cs
            /NomadicMethod/ExerciseVideoView.cs
            /NomadicMethod/RecoveryPrivacyActivity.cs
            /NomadicMethod/AndroidManifest.xml
            /NomadicMethod/WorkoutBlockTimelineView.cs
            /NomadicMethod/Data/**
            /NomadicMethod/Models/**
            /NomadicMethod/Services/**
            /NomadicMethod/Resources/color/**
            /NomadicMethod/Resources/drawable/**
            /NomadicMethod/Resources/drawable-xxhdpi/**
            /NomadicMethod/Resources/layout/**
            /NomadicMethod/Resources/values/**
            /docs/catalog-audit/modifier_coverage_deficits_2026-08-29.json
            /docs/catalog-audit/modifier_coverage_deficits_current.json
            /docs/catalog-audit/migration-2026-09-05.json
            /docs/catalog-audit/training-claim-corrections-2026-09-05.json
            /tools/nomadic_method_appicon.svg
            /tools/ExerciseMirrorRelationships.psd1
            /tools/Test-ExerciseMirrorRelationshipAudit.ps1
            /tools/ExerciseSessionMovements.psd1
            /tools/Test-ExerciseSessionMovementAudit.ps1
            /tools/CanonicalMuscleGroups.psd1
            /tools/ExerciseSecondaryTrainingClaims.psd1
            /tools/Test-ExerciseSecondaryTrainingClaimAudit.ps1
            /tools/RealExerciseCatalog.psd1
            /tools/AdditionalExerciseCatalog.psd1
            /tools/ExerciseCatalogDefinitions.ps1
            /tools/Test-ExerciseCatalogDefinitions.ps1
            /tools/ExerciseLocomotionSpaces.ps1
            /tools/ExerciseLocomotionSpaces.psd1
            /tools/Test-ExerciseLocomotionAudit.ps1
            /tools/ExerciseFloorContacts.ps1
            /tools/ExerciseFloorContacts.psd1
            /tools/ExerciseElevationRequirements.psd1
            /tools/ExerciseElevationRequirements.ps1
            /tools/Test-ExerciseElevationRequirementAudit.ps1
            /tools/Test-ExerciseFloorContactAudit.ps1
            /tools/ExerciseHardFloorCompatibility.psd1
            /tools/Test-ExerciseHardFloorCompatibilityAudit.ps1
            /tools/ExerciseExecutionCorrections.psd1
            /tools/ExerciseDirectionMediaTransforms.psd1
            /tools/Generate-ExerciseCatalog.ps1
            /tools/Test-ExerciseExecutionProtocols.ps1
            /tools/Test-ExerciseSideSequenceOverrides.ps1
            /tools/generate-exercise-fitness-ceiling-scores.mjs
            /tools/ExerciseFitnessCeilingScores.json
            /tools/ExerciseFitnessCeilingCoveragePolicy.json
            /tools/ExerciseReactionCues.json
            /docs/ACSM_FITNESS_CEILING_SCORING.md
            /docs/catalog-audit/acsm-fitness-ceiling-scores.csv
            /docs/catalog-audit/acsm-fitness-ceiling-coverage.json
            /docs/catalog-audit/acsm-fitness-ceiling-gaps.md
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up response media verification
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi

      - name: Validate reaction response media
        run: node tools/generate-reaction-drill-media.mjs --check

      - name: Validate catalog review evidence contracts
        shell: pwsh
        run: ./tools/Test-CatalogReviewEvidence.ps1

      - name: Validate precise skill admissions and reviewed media
        shell: pwsh
        run: |
          ./tools/Test-PreciseSkillAdmissions.ps1
          ./tools/Test-PreciseSkillAdmissions.ps1 -Admission ability-admissions-2026-10-23
          ./tools/Test-PreciseSkillAdmissions.ps1 -Admission zopd-admissions-2026-10-24

      - name: Validate mirror relationship audit
        shell: pwsh
        run: ./tools/Test-ExerciseMirrorRelationshipAudit.ps1

      - name: Validate session movement audit
        shell: pwsh
        run: ./tools/Test-ExerciseSessionMovementAudit.ps1

      - name: Validate muscle training claims
        shell: pwsh
        run: ./tools/Test-ExerciseSecondaryTrainingClaimAudit.ps1

      - name: Validate stable exercise identities
        shell: pwsh
        run: ./tools/Test-ExerciseCatalogDefinitions.ps1

      - name: Validate locomotion catalog minimums
        shell: pwsh
        run: ./tools/Test-ExerciseLocomotionAudit.ps1

      - name: Validate floor contacts and combined equipment minimums
        shell: pwsh
        run: ./tools/Test-ExerciseFloorContactAudit.ps1

      - name: Validate elevation equipment and combined floor minimums
        shell: pwsh
        run: ./tools/Test-ExerciseElevationRequirementAudit.ps1

      - name: Validate complete execution protocols and frozen workout media
        shell: pwsh
        run: |
          ./tools/Test-ExerciseExecutionProtocols.ps1
          ./tools/Test-ExerciseSideSequenceOverrides.ps1

      - name: Test
        run: npm test
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
