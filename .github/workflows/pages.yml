name: Deploy Nomadic Method web

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/pages.yml"
      - "web/**"
      - "Flux/Assets/exercises.json"
      - "Flux/Assets/exercise_videos/**"
      - "Flux/Assets/exercise_direction_videos/**"
      - "Flux/Assets/exercise_hold_frames/**"
      - "Flux/Resources/raw/**"
      - "Flux/Flux.csproj"
      - "Flux/MainActivity.cs"
      - "Flux/MainActivity.Recovery.cs"
      - "Flux/RecoveryPrivacyActivity.cs"
      - "Flux/AndroidManifest.xml"
      - "Flux/Data/**"
      - "Flux/Models/**"
      - "Flux/Services/**"
      - "Flux/Resources/color/**"
      - "Flux/Resources/drawable/**"
      - "Flux/Resources/drawable-xxhdpi/**"
      - "Flux/Resources/layout/**"
      - "Flux/Resources/values/**"
      - "docs/catalog-audit/modifier_coverage_deficits_2026-08-29.json"
      - "docs/catalog-audit/modifier_coverage_deficits_current.json"
      - "docs/catalog-audit/migration-2026-09-05.json"
      - "docs/catalog-audit/training-claim-corrections-2026-09-05.json"
      - "tools/flux_appicon.svg"
      - "tools/ExerciseMirrorRelationships.psd1"
      - "tools/Test-ExerciseMirrorRelationshipAudit.ps1"
      - "tools/ExerciseSessionMovements.psd1"
      - "tools/Test-ExerciseSessionMovementAudit.ps1"
      - "tools/CanonicalMuscleGroups.psd1"
      - "tools/ExerciseSecondaryTrainingClaims.psd1"
      - "tools/Test-ExerciseSecondaryTrainingClaimAudit.ps1"
      - "tools/RealExerciseCatalog.psd1"
      - "tools/AdditionalExerciseCatalog.psd1"
      - "tools/ExerciseCatalogDefinitions.ps1"
      - "tools/Test-ExerciseCatalogDefinitions.ps1"
      - "tools/ExerciseHardFloorCompatibility.psd1"
      - "tools/Test-ExerciseHardFloorCompatibilityAudit.ps1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out runtime files
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /web/**
            /Flux/Assets/exercises.json
            /Flux/Assets/exercise_videos/**
            /Flux/Assets/exercise_direction_videos/**
            /Flux/Assets/exercise_hold_frames/**
            /Flux/Resources/raw/**
            /Flux.Tests/CatalogInvariantTests.cs
            /Flux/Flux.csproj
            /Flux/MainActivity.cs
            /Flux/MainActivity.Recovery.cs
            /Flux/RecoveryPrivacyActivity.cs
            /Flux/AndroidManifest.xml
            /Flux/WorkoutBlockTimelineView.cs
            /Flux/Data/**
            /Flux/Models/**
            /Flux/Services/**
            /Flux/Resources/color/**
            /Flux/Resources/drawable/**
            /Flux/Resources/drawable-xxhdpi/**
            /Flux/Resources/layout/**
            /Flux/Resources/values/**
            /docs/catalog-audit/modifier_coverage_deficits_2026-08-29.json
            /docs/catalog-audit/modifier_coverage_deficits_current.json
            /docs/catalog-audit/migration-2026-09-05.json
            /docs/catalog-audit/training-claim-corrections-2026-09-05.json
            /tools/flux_appicon.svg
            /tools/ExerciseMirrorRelationships.psd1
            /tools/Test-ExerciseMirrorRelationshipAudit.ps1
            /tools/ExerciseSessionMovements.psd1
            /tools/Test-ExerciseSessionMovementAudit.ps1
            /tools/CanonicalMuscleGroups.psd1
            /tools/ExerciseSecondaryTrainingClaims.psd1
            /tools/Test-ExerciseSecondaryTrainingClaimAudit.ps1
            /tools/RealExerciseCatalog.psd1
            /tools/AdditionalExerciseCatalog.psd1
            /tools/ExerciseCatalogDefinitions.ps1
            /tools/Test-ExerciseCatalogDefinitions.ps1
            /tools/ExerciseHardFloorCompatibility.psd1
            /tools/Test-ExerciseHardFloorCompatibilityAudit.ps1
          sparse-checkout-cone-mode: false

      - name: Validate mirror relationship audit
        shell: pwsh
        run: ./tools/Test-ExerciseMirrorRelationshipAudit.ps1

      - name: Validate session movement audit
        shell: pwsh
        run: ./tools/Test-ExerciseSessionMovementAudit.ps1

      - name: Validate muscle training claims
        shell: pwsh
        run: ./tools/Test-ExerciseSecondaryTrainingClaimAudit.ps1

      - name: Validate stable exercise identities
        shell: pwsh
        run: ./tools/Test-ExerciseCatalogDefinitions.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test
        run: npm test
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
