<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5efe7" />
    <meta name="color-scheme" content="light" />
    <meta name="application-name" content="Nomadic Method" />
    <meta name="apple-mobile-web-app-title" content="Nomadic Method" />
    <meta name="description" content="Nomadic Method: a whole-body workout for exactly the time you have. No account. No equipment by default. Keep the movements you want to do again." />
    <title>Nomadic Method</title>
    <link rel="icon" href="./assets/nomadic_method_appicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preload" href="./data/exercises.json" as="fetch" crossorigin />
    <link rel="preload" href="./data/asset-versions.json" as="fetch" crossorigin />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main id="app">
      <section id="duration-screen" class="app-screen duration-screen" aria-label="Workout duration">
        <div class="duration-scroll">
          <div class="duration-content">
            <div class="duration-identity">
              <img class="nomadic-method-icon" src="./assets/nomadic_method_appicon.svg" alt="Nomadic Method" />
              <div id="duration-dial" class="duration-dial">
                <output id="duration-value" class="duration-value" for="duration-range">10</output>
                <span class="duration-unit" aria-hidden="true">MIN</span>
                <svg class="duration-lock" viewBox="0 0 24 24" aria-label="Workout duration locked during workout">
                  <path d="M7 10V7a5 5 0 0 1 10 0v3M6 10h12v10H6Z"></path>
                </svg>
              </div>
            </div>

            <div class="duration-controls">
              <div class="duration-step-row">
                <button
                  id="duration-decrease"
                  class="step-button"
                  type="button"
                  aria-label="Select previous workout duration"
                >
                  <span class="minus-icon" aria-hidden="true"></span>
                </button>
                <input
                  id="duration-range"
                  class="duration-range"
                  type="range"
                  min="0"
                  max="9"
                  step="1"
                  value="3"
                  aria-label="Workout duration"
                />
                <button
                  id="duration-increase"
                  class="step-button"
                  type="button"
                  aria-label="Select next workout duration"
                >
                  <span class="plus-icon" aria-hidden="true"></span>
                </button>
              </div>
              <div id="duration-labels" class="duration-labels" aria-hidden="true">
                <span>3</span><span>5</span><span>7</span><span>10</span>
                <span>15</span><span>20</span><span>30</span><span>45</span>
                <span>60</span><span>90</span>
              </div>
              <div class="duration-modifiers">
                <div
                  class="modifier-group modifier-context-group"
                  role="group"
                  aria-label="Workout conditions"
                >
                <button
                  id="upper-body-clothing-modifier"
                  class="modifier-tile"
                  type="button"
                  aria-label="Upper-body clothing: worn"
                  aria-pressed="true"
                  title="upper-body clothing ON"
                >
                  <svg class="modifier-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill-rule="evenodd" d="M6.5 3h2.75C9.72 4.19 10.71 5 12 5s2.28-.81 2.75-2h2.75L23 7.5l-3 4-2-1.25V19a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-8.75L4 11.5l-3-4L6.5 3Zm.7 2L3.8 7.8l.6.8L8 6.35V19h8V6.35l3.6 2.25.6-.8L16.8 5h-.77C15.17 6.25 13.74 7 12 7s-3.17-.75-4.03-2H7.2Z" />
                  </svg>
                </button>
                <button
                  id="hard-floor-modifier"
                  class="modifier-tile"
                  type="button"
                  aria-label="Floor surface: hard and slippery floor"
                  aria-pressed="true"
                  data-hard-floor="hard"
                >
                  <span class="modifier-icon floor-icon" aria-hidden="true">
                    <span class="floor-glyph floor-glyph-hard"></span>
                    <span class="floor-glyph floor-glyph-soft"></span>
                  </span>
                </button>
                <button
                  id="insect-modifier"
                  class="modifier-tile"
                  type="button"
                  aria-label="Insect modifier"
                  aria-pressed="false"
                >
                  <svg class="modifier-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path opacity=".62" d="M14.2 9.8C12.9 5.4 9.8 2.5 7.1 2.7 5.5 2.8 6.4 6.3 13.1 11.1ZM13.4 10.8C9.8 7.8 5.7 7.6 4.4 9.7 3.5 11.2 7.2 12.7 13.6 12.1Z" />
                    <path d="M18.2 6.7a1.7 1.7 0 1 1 0 3.4 1.7 1.7 0 1 1 0-3.4ZM16.5 8.5c-1.7-1.2-4.1-.7-4.7 1.1-.6 1.8.5 3.6 2.5 4 1.8.4 3.7-.8 3.9-2.7.2-1-.5-1.8-1.7-2.4ZM12.7 11.4c-2.5.3-6.4 2.1-9.5 5.1 4.2-.5 8.6-2.1 11.4-3.8Z" />
                    <path d="m19.6 7.4 3.4-2.6M14.3 12.7l-2.5 3.5-2.3 5.1M15.6 12.7l1.3 3.7-.6 5.1M16.9 11.9l3.1 2.4 1.3 4.3" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.15" />
                  </svg>
                </button>
                <button
                  id="silence-modifier"
                  class="modifier-tile"
                  type="button"
                  aria-label="Quiet exercise filter: quiet exercises only"
                  aria-pressed="true"
                >
                  <svg class="modifier-icon no-clap-icon" viewBox="0 0 256 256" aria-hidden="true">
                    <!-- Hands-clapping silhouette adapted from Phosphor Icons (MIT). -->
                    <path d="M160.22 24V8a8 8 0 0 1 16 0v16a8 8 0 0 1-16 0Zm35.88 17a7.91 7.91 0 0 0 4.17 1.17 8 8 0 0 0 6.84-3.83l8-13.11a8 8 0 0 0-13.68-8.33l-8 13.1a8 8 0 0 0 2.67 11Zm47.51 12.55a8 8 0 0 0-10.08-5.16l-15.06 4.85a8 8 0 0 0 2.46 15.62 8.15 8.15 0 0 0 2.46-.39l15.05-4.85a8 8 0 0 0 5.17-10.07ZM217 97.58a80.22 80.22 0 0 1-10.22 94c-.34 1.73-.72 3.46-1.19 5.18A80.17 80.17 0 0 1 58.77 216L23.5 155a26 26 0 0 1 19.24-38.79l-3-5.2a26 26 0 0 1 19.2-38.78L58.24 71a26 26 0 0 1 37.23-34.47A26.06 26.06 0 0 1 140.3 37l12.26 21.2A26.07 26.07 0 0 1 195.81 61ZM109.07 55l25 43.17a26 26 0 0 1 17.33-10L126.42 45a10 10 0 1 0-17.35 10ZM72.12 63l6.46 11.17a26.05 26.05 0 0 1 17.32-10L89.45 53A10 10 0 1 0 72.12 63Zm111.54 81-20.22-35a10 10 0 0 0-17.74 9.25L158.3 140a8 8 0 0 1-13.87 8l-36.5-63a10 10 0 1 0-17.35 10l26.05 45a8 8 0 0 1-13.87 8L71 93a10 10 0 0 0-17.33 10l35.22 61A8 8 0 0 1 75 172l-20.28-35a10 10 0 0 0-17.34 10l35.27 61a64.12 64.12 0 0 0 117.42-15.44 63.52 63.52 0 0 0-6.41-48.56Zm19.41-38.42L181.93 69a10 10 0 0 0-17.38 10l33 57.05A80.2 80.2 0 0 1 207 161.51a64.23 64.23 0 0 0-3.93-55.93Z" />
                    <path class="no-clap-slash-cutout" d="M36 220 220 36" />
                    <path class="no-clap-slash" d="M36 220 220 36" />
                  </svg>
                </button>
                <button
                  id="shy-modifier"
                  class="modifier-tile"
                  type="button"
                  aria-label="Shy mode: off; all exercises allowed"
                  aria-pressed="false"
                  title="shy mode OFF"
                >
                  <svg class="modifier-icon" viewBox="0 0 32 32" aria-hidden="true">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 .9C11.43.9 7.8 4.53 7.8 9.1s3.63 8.2 8.2 8.2 8.2-3.63 8.2-8.2S20.57.9 16 .9Zm-2 6.8c0 .72-.58 1.3-1.3 1.3s-1.3-.58-1.3-1.3.58-1.3 1.3-1.3S14 6.98 14 7.7Zm6.6 0c0 .72-.58 1.3-1.3 1.3S18 8.42 18 7.7s.58-1.3 1.3-1.3 1.3.58 1.3 1.3Z" />
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.9 5.4c.5-.85 1.4-1.17 2.3-.92m5.6 0c.9-.25 1.8.07 2.3.92m-9.2 6c1.1 1.5 2.45 2.3 4.1 2.3s3-.8 4.1-2.3" />
                    <path id="shy-hand" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.45" d="m7.2 30.1-2.95-3.55c-.63-.76-.48-1.4.18-1.93l1.07-.85 1.45-4.87c.26-.85.97-1.17 1.64-.84.59.29.76.84.57 1.52l-.52 1.91 4-3.66c.73-.67 1.51-.66 2.07-.01.57.67.37 1.37-.24 1.91l-2.92 2.62c.75-.5 1.5-.36 2 .24.45.54.27 1.07-.19 1.51.75-.43 1.47-.22 1.86.38.38.6.13 1.13-.34 1.5.67-.26 1.29.01 1.56.58.25.54-.01 1-.51 1.34l-5.73 2.79c-1.07.53-2.16.41-3-.59Z" />
                    <use href="#shy-hand" transform="translate(32 0) scale(-1 1)" />
                  </svg>
                </button>
                </div>
                <div
                  class="modifier-group modifier-intensity-group"
                  role="group"
                  aria-label="Workout intensity"
                >
                  <button
                    id="light-workout-modifier"
                    class="modifier-tile"
                    type="button"
                    aria-label="Workout intensity: regular workout"
                    aria-pressed="false"
                    title="light mode OFF"
                  >
                    <span
                      class="modifier-icon light-mode-glyph"
                      aria-hidden="true"
                    ></span>
                    <span
                      id="light-workout-countdown"
                      class="light-mode-countdown"
                      aria-hidden="true"
                    >18</span>
                  </button>
                </div>
                <div
                  class="modifier-group modifier-equipment-group"
                  role="group"
                  aria-label="Available equipment"
                >
                <button
                  id="wall-modifier"
                  class="modifier-tile"
                  type="button"
                    aria-label="Wall equipment: no wall available"
                    aria-pressed="false"
                    title="equipment OFF: wall"
                    data-wall-equipment="none"
                  >
                    <svg class="modifier-icon wall-icon" viewBox="0 0 24 24" aria-hidden="true">
                      <g class="wall-glyph wall-glyph-none">
                        <path class="modifier-icon-stroke" d="M3 4h18v16H3Zm0 5h18M3 15h18M9 4v5m7 0v6m-8 0v5M3 21 21 3" />
                      </g>
                      <g class="wall-glyph wall-glyph-soles-stay-off">
                        <rect class="wall-no-sole-mask" width="24" height="24" />
                      </g>
                      <g class="wall-glyph wall-glyph-soles-may-touch">
                        <path class="modifier-icon-stroke" d="M3 4h18v16H3Zm0 5h18M3 15h18M9 4v5m7 0v6m-8 0v5" />
                      </g>
                    </svg>
                </button>
                <button
                  id="mirror-modifier"
                  class="modifier-tile"
                  type="button"
                  aria-label="Mirror equipment: no mirror available"
                  aria-pressed="false"
                  data-mirror-equipment="none"
                >
                  <svg class="modifier-icon mirror-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <g class="mirror-glyph mirror-glyph-none">
                      <path class="modifier-icon-stroke" d="M12 2.5c-3.9 0-6 2.9-6 8s2.1 8 6 8 6-2.9 6-8-2.1-8-6-8Z" />
                      <path class="modifier-icon-stroke mirror-detail" d="m9 8.5 2.5-2.5M9 12l5.5-5.5M12 18.5v3M8.5 21.5h7" />
                    </g>
                    <g class="mirror-glyph mirror-glyph-compact">
                      <path class="modifier-icon-stroke" d="M12 3.5c-4.8 0-8 2.3-8 6s3.2 6 8 6 8-2.3 8-6-3.2-6-8-6Z" />
                      <path class="modifier-icon-stroke mirror-detail" d="m8 8 2.5-2.5M8 11.5l5-5m-1 9v5m-3.5 0h7" />
                    </g>
                    <g class="mirror-glyph mirror-glyph-tall">
                      <path class="modifier-icon-stroke" d="M8 2.5h8a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2Z" />
                      <path class="modifier-icon-stroke mirror-detail" d="m9 7 3-3m-3 8 6-6m-6 13.5L8 22m7-2.5 1 2.5M6.5 22h11" />
                    </g>
                  </svg>
                </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="duration-action-bar">
          <button id="end-session" class="end-session" type="button" aria-label="End session" title="End session">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" /></svg>
          </button>
          <button id="begin-workout" class="primary-button begin-workout" type="button">
            <span class="forward-arrow" aria-hidden="true"></span>
          </button>
        </div>
        <div
          id="modifier-feedback"
          class="modifier-feedback"
          role="status"
          aria-live="polite"
          aria-atomic="true"
          hidden
        ></div>
      </section>

      <section id="workout-screen" class="app-screen workout-screen" aria-label="Workout" hidden>
        <div id="phase-surface" class="phase-surface" aria-hidden="true">
          <div id="phase-left" class="phase-half"></div>
          <div id="phase-right" class="phase-half"></div>
        </div>

        <div class="workout-content">
          <header id="workout-header" class="workout-header">
            <div class="workout-meta">
              <span id="workout-progress-text" class="workout-progress-text">01&nbsp;&nbsp;/&nbsp;&nbsp;10</span>
              <div id="execution-signifier" class="execution-signifier" role="img" aria-label="">
                <span id="execution-block-track" class="execution-block-track" aria-hidden="true"></span>
              </div>
              <button
                id="workout-setup"
                class="workout-setup-button"
                type="button"
                aria-label="Change workout setup"
                title="Change workout setup"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M7 14v6"></path>
                </svg>
              </button>
            </div>
            <div class="progress-track workout-progress" aria-hidden="true">
              <span id="workout-progress-fill"></span>
            </div>
            <h1 id="exercise-name" class="exercise-name"></h1>
          </header>

          <div class="exercise-media-area">
            <div id="exercise-media-card" class="exercise-media-card">
              <video
                id="exercise-video"
                muted
                playsinline
                preload="metadata"
                aria-hidden="true"
              ></video>
              <img id="hold-frame" class="hold-frame" alt="" hidden />
              <span id="hold-badge" class="hold-badge" hidden>STATIC</span>
              <div id="media-scrim" class="media-scrim" aria-hidden="true">
                <span class="loading-spinner"></span>
              </div>
              <div id="media-error" class="media-error" hidden>
                <span>Demonstration unavailable</span>
                <button id="media-retry" class="quiet-button" type="button">Try again</button>
              </div>
            </div>
          </div>

          <div class="workout-action-host">
            <div id="ready-panel" class="workout-panel ready-panel">
              <div class="ready-controls">
                <button
                  id="shuffle-exercise"
                  class="shuffle-button"
                  type="button"
                  aria-label="Reject and replace this exercise"
                  title="Reject and replace this exercise"
                  hidden
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 7.5h4.5c4.5 0 4.5 9 9 9H21M17 12.5l4 4-4 4M3 16.5h4.5c1.52 0 2.53-1.03 3.4-2.4M13.08 9.9c.87-1.37 1.88-2.4 3.42-2.4H21M17 3.5l4 4-4 4"></path>
                  </svg>
                </button>
                <button
                  id="start-movement"
                  class="primary-button action-button start-playback"
                  type="button"
                  aria-label="Start exercise"
                  title="Start exercise"
                  disabled
                >
                  <svg class="start-playback-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 5v14l11-7Z"></path>
                  </svg>
                </button>
              </div>
            </div>

            <div id="move-panel" class="workout-panel move-panel" hidden>
              <div class="media-controls" role="group" aria-label="Exercise playback controls">
                <button
                  id="repeat-exercise"
                  class="media-control"
                  type="button"
                  aria-label="Repeat this exercise from the beginning"
                  title="Repeat exercise"
                  disabled
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M17 2 21 6 17 10V7H7a4 4 0 0 0-4 4H1a6 6 0 0 1 6-6h10ZM7 22l-4-4 4-4v3h10a4 4 0 0 0 4-4h2a6 6 0 0 1-6 6H7Z"></path>
                  </svg>
                </button>
                <button
                  id="toggle-playback"
                  class="media-control media-control-primary"
                  type="button"
                  data-state="playing"
                  aria-label="Pause exercise"
                  title="Pause exercise"
                  disabled
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path class="playback-pause-icon" d="M6 5h4v14H6ZM14 5h4v14h-4Z"></path>
                    <path class="playback-play-icon" d="M8 5v14l11-7Z"></path>
                  </svg>
                </button>
                <button
                  id="next-exercise"
                  class="media-control"
                  type="button"
                  aria-label="Next exercise; reject this exercise for future sessions"
                  title="Next exercise"
                  disabled
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 5v14l10-7ZM17 5h2v14h-2Z"></path>
                  </svg>
                </button>
              </div>
              <div class="movement-time-row">
                <output id="movement-countdown" class="movement-countdown">45</output>
              </div>
              <div id="movement-track" class="progress-track movement-track" aria-hidden="true">
                <span id="movement-progress-fill"></span>
              </div>
            </div>

            <div id="rest-panel" class="workout-panel rest-panel" hidden>
              <div class="phase-row rest-row">
                <button
                  id="toggle-rest"
                  class="rest-playback-control"
                  type="button"
                  data-state="playing"
                  aria-label="Pause rest"
                  title="Pause rest"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path class="rest-pause-icon" d="M6 5h4v14H6ZM14 5h4v14h-4Z"></path>
                    <path class="rest-play-icon" d="M8 5v14l11-7Z"></path>
                  </svg>
                </button>
                <output id="rest-countdown" class="rest-countdown">15</output>
              </div>
              <div class="progress-track rest-track" aria-hidden="true">
                <span id="rest-progress-fill"></span>
              </div>
              <button
                id="keep-exercise"
                class="primary-button keep-button"
                type="button"
                aria-label="Keep exercise for the next session"
                title="Keep exercise"
              >
                <svg class="keep-love-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 21.35 10.55 20.03C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3 9.24 3 10.91 3.81 12 5.09 13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5 22 12.28 18.6 15.36 13.45 20.03Z"></path>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </section>

      <section id="completion-screen" class="app-screen completion-screen" aria-label="Workout complete" hidden>
        <div class="completion-hero">
          <div class="completion-halo">
            <div class="completion-halo-inner">
              <div class="completion-mark" role="img" aria-label="Workout complete">
                <span aria-hidden="true"></span>
              </div>
            </div>
          </div>
        </div>
        <div class="completion-action-bar">
          <button id="done-button" class="completion-button" type="button">Done</button>
        </div>
      </section>
    </main>
    <dialog id="end-session-dialog" class="end-session-dialog" aria-labelledby="end-session-title" aria-describedby="end-session-description">
      <form method="dialog">
        <h2 id="end-session-title">End session?</h2>
        <p id="end-session-description">End this session? Completed work stays in your history.</p>
        <div class="end-session-dialog-actions">
          <button value="cancel" autofocus>Cancel</button>
          <button value="end" class="primary-button">End session</button>
        </div>
      </form>
    </dialog>
    <div id="status" class="visually-hidden" aria-live="polite"></div>
    <script src="./light-cadence.js"></script>
    <script src="./instant-controls.js"></script>
  </body>
</html>
